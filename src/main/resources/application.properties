spring.application.name=mealflow-meal-management-service

server.port=${PORT:8085}

# Base de Datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mealfd}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Eureka Client
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

eureka.instance.prefer-ip-address=true
eureka.instance.non-secure-port-enabled=true
eureka.instance.secure-port-enabled=false

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# JPA / Hibernate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.gabrielmamani.mealmanagement.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad básica & Swagger UI
spring.security.user.name=${SWAGGER_USER:admin}
spring.security.user.password=${SWAGGER_PASSWORD:admin}

# JWT Configuration
authorization.jwt.secret=${JWT_SECRET:MySuperSecretKeyChangeThisKeyThatHasAtLeast32Chars}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}
spring.crac.enabled=false

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:*,https://mealflow-745df.web.app,https://mealflow-745df.firebaseapp.com}

# Documentación OpenAPI / Swagger
documentation.application.title=Meal Management Service - Mealflow
documentation.application.description=Microservicio de gestión de comidas para la plataforma Mealflow.
documentation.application.version=1.0.0
documentation.application.contact.name=Equipo Devscracks
documentation.application.contact.email=soporte@devscracks.com

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms
spring.rabbitmq.listener.simple.retry.max-attempts=5

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Redis & Cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# Actuator & Métricas (Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}