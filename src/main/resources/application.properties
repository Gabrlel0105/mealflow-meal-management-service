spring.application.name=mealflow-meal-management-service

server.port=${PORT:8085}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mealf}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:tontinpochis}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.devscracks.mealmanagement.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.user.name=admin
spring.security.user.password=admin123

authorization.jwt.secret=${JWT_SECRET:MySuperSecretKeyChangeThisKeyThatHasAtLeast32Chars}
authorization.jwt.expiration.days=7
spring.crac.enabled=false

documentation.application.title=Meal Management Service - Mealflow
documentation.application.description=Microservicio de gestion de comidas para la plataforma Mealflow.
documentation.application.version=1.0.0
documentation.application.contact.name=Equipo Devscracks
documentation.application.contact.email=soporte@devscracks.com